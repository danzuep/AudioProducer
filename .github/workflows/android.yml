name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_neural:
        description: Test on-device neural inference with the pinned model
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: |
          bash scripts/test-next-version.sh
          ./gradlew :core:jvmTest :app:testDebugUnitTest :app:assembleDebug
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare neural test model
        if: inputs.test_neural && matrix.api-level == 35
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/FabienCouprie/attic/releases/download/assets/tts-speecht5.zip \
            -o "$RUNNER_TEMP/tts-speecht5.zip"
          echo "201abdf7e3128ef6c8b11e491dc6edac024e62417aca44cc541591402c8d3f10  $RUNNER_TEMP/tts-speecht5.zip" | sha256sum --check
          unzip -p "$RUNNER_TEMP/tts-speecht5.zip" tts-speecht5/Xenova/speecht5_hifigan/onnx/model.onnx > "$RUNNER_TEMP/neural-model.onnx"
          echo "26408d9b8b3e83e66a3ef614a5621b84cacdcabd81b3a6a2fa984eb788566e6c  $RUNNER_TEMP/neural-model.onnx" | sha256sum --check
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-android-device-tests.sh ${{ inputs.test_neural && matrix.api-level == 35 }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: launch-test-reports-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
