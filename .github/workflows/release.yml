name: Release APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dry-run' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] &&
            [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release tags require the release keystore secrets."
            exit 1
          fi
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          fi
      - name: Test and build APKs
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] &&
            [[ ! "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use the vX.Y.Z format."
            exit 1
          fi
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            version="$major.$minor.$patch"
            version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
            ./gradlew :core:jvmTest :app:testDebugUnitTest :app:assembleRelease \
              -PappVersion="$version" -PappVersionCode="$version_code"
          else
            ./gradlew :core:jvmTest :app:testDebugUnitTest :app:assembleRelease
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: audio-workbench-apks
          path: app/build/outputs/apk/release/AudioWorkbench-*.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/AudioWorkbench-*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/AudioWorkbench-*.apk --generate-notes
          fi
